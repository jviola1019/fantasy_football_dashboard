name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `[main]` alone meant a STACKED remediation PR (one fix branch based on
    # another) got no CI at all — it is not targeting main, so nothing ran and
    # the PR looked clean because it was never checked. Audit 2026-08-20.
    branches: [main, "fix/**"]

# Least privilege: no job here needs write access to anything (audit F-006).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck + lint + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/check-doc-secrets.ts
      - run: npx tsx scripts/check-vuln-exceptions.ts
      - run: npx tsx scripts/check-lockfile-advisories.ts
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      # The shipped in-season ranker must reproduce protocol 5's validated
      # statistic on the archived evaluation set. This caught a real defect --
      # the model used a sample sd where the validated harness used a population
      # sd, which changes the pooled ranking -- and it would have shipped a model
      # that merely resembled the one that was tested. Reads a committed archive;
      # no network.
      - run: npx tsx scripts/verify-inseason-fidelity.ts

  postgres:
    # Audit 2026-08-20 SS10. Without this job, 31 integration tests covering the
    # PRODUCTION database driver are silently skipped on every run:
    #   src/db/postgres.integration.test.ts                13
    #   src/lib/auth/throttle.pg.integration.test.ts       11
    #   src/lib/lifecycle/reconcile.pg.integration.test.ts  7
    # These are not duplicates of the SQLite coverage. The ON CONFLICT upsert,
    # the quoted camelCase identifiers, the timestamp mapping and the NOT IN
    # bound-array path all differ between drivers, and the throttle concurrency
    # tests depend on real transactional semantics that better-sqlite3 cannot
    # reproduce. A commit-message claim of a manual local run is not a gate.
    name: postgres integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pinned to a specific minor so a silent upstream bump cannot change
        # behaviour under us. Recorded in reports/2026-08-20/AUDIT-LEDGER.md
        # alongside the version this was developed against locally (17.11).
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: rae
          POSTGRES_PASSWORD: rae_ci_password
          POSTGRES_DB: rae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rae -d rae_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RAE_PG_TEST_URL: postgres://rae:rae_ci_password@127.0.0.1:5432/rae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record the Postgres version actually exercised
        run: |
          node -e "
            const postgres = require('postgres');
            const sql = postgres(process.env.RAE_PG_TEST_URL, { max: 1 });
            sql\`select version()\`
              .then((r) => { console.log(r[0].version); return sql.end(); })
              .catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Run the PostgreSQL integration suites
        run: npx vitest run src/db/postgres.integration.test.ts src/lib/auth/throttle.pg.integration.test.ts src/lib/lifecycle/reconcile.pg.integration.test.ts --reporter=verbose
      - name: Fail if the suites were skipped rather than executed
        # The failure mode this guards: RAE_PG_TEST_URL not reaching the runner
        # turns every one of these into describe.skip, and the job goes green
        # having tested nothing. That is the exact condition SS10 exists to end.
        run: |
          npx vitest run src/db/postgres.integration.test.ts src/lib/auth/throttle.pg.integration.test.ts src/lib/lifecycle/reconcile.pg.integration.test.ts --reporter=json --outputFile=pg-results.json
          node -e "
            const r = require('./pg-results.json');
            const passed = r.numPassedTests ?? 0;
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log('passed=' + passed + ' skipped=' + skipped);
            if (skipped > 0) { console.error('PostgreSQL suites were SKIPPED - the service was not reachable.'); process.exit(1); }
            if (passed < 25) { console.error('Expected at least 25 PostgreSQL tests, saw ' + passed + '.'); process.exit(1); }
          "

  e2e:
    name: playwright + axe
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-prod-but-32-bytes-base64=
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx next build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse perf + a11y
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-prod-but-32-bytes-base64=
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next build
      - run: npx lhci autorun
      # Report how much of the score above was noise. Asserts nothing; without
      # it "the gate passed" cannot be told apart from "the gate got a lucky
      # draw" (audit 2026-08-23). `if: always()` so a failed assertion still
      # tells us whether the failure was real or a wide-spread draw.
      - name: lighthouse run-to-run variance
        if: always()
        run: npx tsx scripts/lighthouse-variance.ts
      - name: upload lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/lighthouse
          retention-days: 14
